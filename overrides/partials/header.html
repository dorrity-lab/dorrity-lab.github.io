<!--
  Custom header partial — nav links inline in header bar (upper right).
  Logo/title flush left, nav links flush right, full-width bar.
-->
<header class="md-header md-header--shadow" data-md-component="header">
  <nav class="md-header__inner" aria-label="Header">

    <!-- Logo + site title (left) -->
    <a href="{{ config.extra.homepage | d(nav.homepage.url, true) | url }}" title="{{ config.site_name | e }}" class="md-header__button md-logo" aria-label="{{ config.site_name }}">
      <img src="{{ config.theme.logo | url }}" alt="logo">
    </a>
    <div class="md-header__title" data-md-component="header-title">
      <div class="md-header__ellipsis">
        <div class="md-header__topic">
          <span class="md-ellipsis">{{ config.site_name }}</span>
        </div>
      </div>
    </div>

    <!-- Navigation links (right) -->
    <div class="md-header__nav">
      {% for nav_item in nav %}
        {% if nav_item.children %}
          <a href="{{ nav_item.children[0].url | url }}"{% if nav_item.active %} class="active"{% endif %}>
            {{ nav_item.title }}
          </a>
        {% else %}
          <a href="{{ nav_item.url | url }}"{% if nav_item.active %} class="active"{% endif %}>
            {{ nav_item.title }}
          </a>
        {% endif %}
      {% endfor %}
    </div>

  </nav>
</header>
